plugins {
    id 'com.android.application'
}

// The Google Play edition of Ironhold: a paid download with the whole game
// inside it. A single full-screen WebView plays the game from the app's own
// assets: WebViewAssetLoader serves assets/www over a synthetic https origin
// (appassets.androidplatform.net), so localStorage keeps progress between
// launches like it would on a secure site. The app asks for no permission,
// not even INTERNET: the game makes no network requests, there is no
// purchase inside it, and the website no longer hosts the playable game.
//
// The same shape as Bubble Pop's Play edition. tools/check-apk.js checks
// every APK built here, and the Android workflow opens it on an emulator and
// fails unless the game's page actually loads.

// Release signing: the upload key from android/keystore.properties when it
// exists (never committed; the Release workflow writes it from the repo's
// ANDROID_UPLOAD_* secrets), the debug key otherwise. Play only takes a
// bundle signed with the listing's upload key.
def keystoreFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystoreFile.exists()) {
    keystoreFile.withInputStream { keystoreProps.load(it) }
}

// Every Play upload needs a higher versionCode than any earlier one. The
// release workflow derives it from the version (1.0.0 -> 10000).
def relVersionCode = (project.hasProperty('versionCode') ? project.property('versionCode') : '10100').toString().toInteger()
def relVersionName = (project.hasProperty('versionName') ? project.property('versionName') : '1.1.0').toString()

// The game's files live at the repository root. They are copied into the
// app's assets as assets/www/... at build time, so the app can never drift
// from the game's source and no second copy is checked in. sw.js stays out:
// the files are already local, and a service worker has nothing to do.
def webRoot = rootProject.file('..')
def genAssetsDir = new File(buildDir, 'generated/webAssets')
tasks.register('syncWebAssets', Copy) {
    from(webRoot) {
        include 'index.html', 'manifest.webmanifest', 'privacy.html', '*.css', 'css/**', 'js/**', 'icons/**', 'fonts/**', 'img/**', 'audio/**', 'sound/**', 'game.js'
        exclude 'android/**', 'node_modules/**', 'tests/**', 'tools/**', 'store/**', 'site/**'
    }
    into(new File(genAssetsDir, 'www'))
}

android {
    // The package name is the app's identity on Google Play: the listing is
    // created under it, and Play never lets it change.
    namespace 'com.taugustincst.ironhold'
    compileSdk 36

    defaultConfig {
        applicationId 'com.taugustincst.ironhold'
        minSdk 24
        targetSdk 36
        versionCode relVersionCode
        versionName relVersionName
    }

    signingConfigs {
        if (keystoreFile.exists()) {
            release {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // Nothing worth shrinking, and shrinking is one more way for a
            // class the manifest names to go missing from the dex.
            minifyEnabled false
            shrinkResources false
            signingConfig keystoreFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            assets.srcDirs += genAssetsDir
        }
    }
}

tasks.named('preBuild') { dependsOn 'syncWebAssets' }

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    // WindowCompat and WindowInsetsControllerCompat: full screen on every
    // Android the app supports (the platform's own controller is API 30+).
    implementation 'androidx.core:core:1.16.0'
}
